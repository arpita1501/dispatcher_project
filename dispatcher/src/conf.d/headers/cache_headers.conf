<IfModule mod_headers.c>

    # Versioned clientlibs – 1 month
    <LocationMatch "^/etc\.clientlibs/.*\.[a-f0-9]{32}\.(js|css)$">
        Header set Cache-Control "max-age=2592000, public, immutable"
    </LocationMatch>

    # Non-versioned clientlibs – 2 days
    <LocationMatch "^/etc\.clientlibs/.*\.(js|css)$">
        Header set Cache-Control "max-age=172800, public"
    </LocationMatch>

    # HTML – 10 minutes
    <FilesMatch "\.html$">
        Header always set Cache-Control "max-age=600, public"
    </FilesMatch>

    # Assets – 1 month
    <LocationMatch "\.(png|jpg|jpeg|gif|svg|pdf|woff|woff2|ttf)$">
        Header set Cache-Control "max-age=2592000, public"
    </LocationMatch>

</IfModule>